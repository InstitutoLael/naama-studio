<!doctype html>
<html lang="es-CL">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Sin internet · Naamá</title>
<style>
  html, body { margin: 0; height: 100%; background: #f8f3ed; color: #211a17; font-family: system-ui, -apple-system, sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 16px; padding: 32px; text-align: center; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: 2.4rem; margin: 0; }
  h1 em { color: #8c4a36; }
  p { color: #4f443d; max-width: 30ch; margin: 0 auto; line-height: 1.6; }
  button { margin-top: 12px; min-height: 52px; padding: 0 28px; border: 0; border-radius: 999px; background: #211a17; color: #f8f3ed; font: 600 0.78rem system-ui; letter-spacing: 0.16em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <h1>Sin <em>internet.</em></h1>
  <p>No te preocupes: no se perdió nada. Cuando vuelva la señal, toca el botón.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
